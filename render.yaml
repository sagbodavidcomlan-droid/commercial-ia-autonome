services:
  - type: web
    name: commercial-ia-autonome
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && (command -v npm >/dev/null 2>&1 && (cd whatsapp_bridge && npm install) || true)
    startCommand: python3 app.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
