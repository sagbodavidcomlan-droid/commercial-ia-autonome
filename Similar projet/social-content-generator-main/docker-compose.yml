services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_automation
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_me_123
      - N8N_USER_FOLDER=/home/node/.n8n
      - WEBHOOK_URL=http://localhost:5678
      - N8N_ENCRYPTION_KEY=xK9mP2qR7sT4vW8yZ1cF3gH5jL6nB0vC
      - EXTERNAL_STORAGE_SSH_KEY=
      - EXTERNAL_STORAGE_SSH_HOST=
      - EXTERNAL_STORAGE_SSH_PORT=22
      - EXTERNAL_STORAGE_SSH_USERNAME=
      - EXTERNAL_STORAGE_SSH_PASSWORD=
      - EXTERNAL_STORAGE_SSH_BASE_DIR=
      - EXTERNAL_STORAGE_SSH_PASSPHRASE=
      - GOOGLE_SHEET_ID=1tAf9Gb68v1_d7AuaaMNuHL7JpqPS7uDkflHbCtYcYz8
      - NUELINK_API_KEY=nk_live_5f8b9c7d6a4e2f1b3c0d9e8a7b6c5d
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./project:/project
      - ./n8n/workflow.json:/home/node/.n8n/workflow.json
      - ./project/google_credentials.json:/home/node/.n8n/google_credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
  n8n-db:
    image: postgres:15
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8nPassword123
      - POSTGRES_DB=n8n
    volumes:
      - ./n8n_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./n8n_redis_data:/data
    ports:
      - "6379:6379"
      
  redis:
    image: redis:7-alpine
    container_name: n8n_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data

  # Optional: Simple file server for preview URLs
  preview-server:
    image: nginx:alpine
    container_name: preview_server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./project/output/videos:/usr/share/nginx/html:ro

    user: "1000:1000" 

