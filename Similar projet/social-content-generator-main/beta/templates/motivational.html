<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920">
<style>
  html,body{margin:0;background:#111;height:100%;font-family:Inter}
  .wrap{width:1080px;height:1920px;display:flex;align-items:center;justify-content:center}
  .text{color:#fff;font-size:72px;text-align:center;padding:60px;line-height:1.02;mix-blend-mode:screen}
  .sub{position:absolute;bottom:120px;color:#ffd166;font-size:28px}
</style>
</head><body>
<div class="wrap">
  <div class="text" id="main">Be better today</div>
  <div class="sub" id="cta">Tag someone who needs this</div>
</div>
<script>
(async function(){
  const p = new URLSearchParams(location.search);
  const frame = Number(p.get('frame')||0), steps = Number(p.get('steps')||300);
  const data = await fetch('data.json').then(r=>r.json());
  document.getElementById('main').textContent = data.text || "Be better today";
  document.getElementById('cta').textContent = data.cta || "";
  const prog = Math.sin((frame/steps)*Math.PI);
  document.querySelector('.text').style.opacity = 0.5 + prog*0.5;
})();
</script>
</body></html>
