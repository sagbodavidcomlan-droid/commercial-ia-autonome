<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
  :root{--bg:#0f1724;--accent:#ffd166;--text:#fff;font-family:Inter, system-ui, sans-serif}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
  .wrap{width:1080px;height:1920px;position:relative;display:flex;align-items:center;justify-content:center}
  .card{width:920px;padding:80px 60px;background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);border-radius:24px}
  .quote{font-size:64px;line-height:1.05;color:var(--text);text-align:center}
  .author{margin-top:30px;font-size:36px;color:var(--accent);text-align:right}
  .logo{position:absolute;bottom:60px;left:60px;opacity:0.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="quote" id="quote">Loading…</div>
    <div class="author" id="author"></div>
  </div>
  <img src="../assets/logo.png" class="logo" width="120" />
</div>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const frame = parseInt(params.get('frame')||0,10);
  const steps = parseInt(params.get('steps')||300,10);
  const data = await fetch('data.json').then(r=>r.json());
  document.getElementById('quote').textContent = data.text || "Your quote";
  document.getElementById('author').textContent = data.author ? "— "+data.author : "";
  // simple zoom animation
  const progress = frame / steps;
  const scale = 1 + progress*0.03;
  document.querySelector('.card').style.transform = `scale(${scale})`;
})();
</script>
</body>
</html>

<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920">
<style>
  html,body{margin:0;height:100%;background:#07080a;font-family:Inter,system-ui}
  .stage{width:1080px;height:1920px;position:relative;overflow:hidden}
  .bg{position:absolute;inset:0;background-size:cover;filter:blur(2px) brightness(0.6)}
  .card{position:absolute;left:60px;right:60px;top:240px;padding:60px;border-radius:28px;background:rgba(255,255,255,0.02)}
  .title{color:#ffd166;font-size:48px;margin-bottom:18px}
  .lines{color:#fff;font-size:36px;line-height:1.4}
  .sign{position:absolute;right:60px;top:60px;width:240px;opacity:0.95}
</style>
</head><body>
<div class="stage">
  <div id="bg" class="bg"></div>
  <img id="sign" class="sign" src="../assets/sign_placeholder.png">
  <div class="card">
    <div class="title" id="title">Aries</div>
    <div class="lines" id="lines">Today you will...</div>
  </div>
</div>
<script>
(async function(){
  const p = new URLSearchParams(location.search);
  const frame = Number(p.get('frame')||0); const steps = Number(p.get('steps')||300);
  const data = await fetch('data.json').then(r=>r.json());
  document.getElementById('title').textContent = (data.sign || "Sign").toUpperCase();
  document.getElementById('lines').textContent = data.text || "Daily insight...";
  if (data.bg_image) document.getElementById('bg').style.backgroundImage = `url('../assets/bg/'+data.bg_image)`;
  if (data.sign_image) document.getElementById('sign').src = '../assets/signs/'+data.sign_image;
  const prog = frame/steps;
  document.querySelector('.card').style.transform = `translateY(${(1-prog)*80}px)`;
})();
</script>
</body></html>
